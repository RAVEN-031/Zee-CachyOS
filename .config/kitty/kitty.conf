# --- Environment & General ---
term xterm-256color
allow_remote_control yes
listen_on unix:@mykitty
allow_hyperlinks yes

# --- Window Layout & Behavior ---
remember_window_size  no
background_opacity    0.8
hide_window_decorations no
confirm_OS_window_close 0
dynamic_background_opacity yes

# --- Scrolling ---
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# --- Fonts ---
font_size        12.0
font_family      FiraMono Nerd Font Regular
bold_font        Fira Mono Bold
italic_font      Fira Mono Italic
bold_italic_font Fira Mono Bold Italic

# --- Cursor & Mouse ---
cursor_shape underline
cursor_underline_thickness 1.5
cursor_shape_unfocused hollow
mouse_hide_wait -1
copy_on_select yes
select_by_word_characters ,│`|:"' ()[]{}<>\t

# --- Colors (Nord Palette) ---
background #2E3440
foreground #D8DEE9

# Normal colors
color0 #3B4252
color1 #BF616A
color2 #A3BE8C
color3 #EBCB8B
color4 #81A1C1
color5 #B48EAD
color6 #88C0D0
color7 #E5E9F0

# Bright colors
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# --- Key & Mouse Bindings ---
clear_all_shortcuts yes

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map middle_click paste_from_selection

# Font Size
map ctrl+0 change_font_size all 0

# Scrolling
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end

# Search
map ctrl+shift+f show_scrollback
map ctrl+shift+b show_scrollback

